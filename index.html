<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>해양사고 통계 조회</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f7fb;
    color: #1f2937;
  }
  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 16px 40px;
  }
  h1 { margin: 0 0 8px; font-size: 28px; }
  .sub { margin: 0 0 20px; color: #6b7280; line-height: 1.6; }
  .toolbar {
    display: grid;
    grid-template-columns: 1fr 220px auto;
    gap: 10px;
    margin-bottom: 14px;
  }
  input, select, button {
    width: 100%;
    min-height: 44px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 15px;
    background: white;
  }
  button {
    width: auto;
    cursor: pointer;
    background: #111827;
    color: white;
    border-color: #111827;
  }
  .meta {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    padding: 12px 14px;
    margin-bottom: 14px;
    border-radius: 10px;
    background: white;
    border: 1px solid #e5e7eb;
  }
  .count { font-weight: 700; }
  .source { color: #6b7280; font-size: 14px; }
  .table-box {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    overflow: hidden;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    padding: 10px 12px;
    border-bottom: 1px solid #eef0f3;
    text-align: right;
    white-space: nowrap;
    font-size: 14px;
  }
  th:first-child, td:first-child { text-align: left; }
  th { background: #f9fafb; position: sticky; top: 0; z-index: 1; }
  tr:last-child td { border-bottom: 0; }
  .empty {
    padding: 36px 16px;
    text-align: center;
    color: #6b7280;
  }

  @media (max-width: 700px) {
    .wrap { padding: 18px 12px 28px; }
    h1 { font-size: 23px; }
    .toolbar { grid-template-columns: 1fr; }
    button { width: 100%; }

    .table-box {
      border: none;
      background: transparent;
      overflow: visible;
    }
    table, thead, tbody, th, td, tr {
      display: block;
      width: 100%;
    }
    thead {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    tbody { display: grid; gap: 12px; }
    tr {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 10px 12px;
    }
    td {
      display: grid;
      grid-template-columns: minmax(110px, 42%) 1fr;
      gap: 12px;
      align-items: start;
      text-align: right;
      white-space: normal;
      overflow-wrap: anywhere;
      border-bottom: 1px solid #f0f1f3;
      padding: 8px 0;
    }
    td:first-child { text-align: right; }
    td:last-child { border-bottom: none; }
    td::before {
      content: attr(data-label);
      text-align: left;
      font-weight: 700;
      color: #4b5563;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>해양사고 통계 조회</h1>
  <p class="sub">연도 또는 사고 유형으로 검색하고, 연도 필터를 적용할 수 있습니다.</p>

  <div class="toolbar">
    <input id="searchInput" type="search" placeholder="예: 2010, 충돌, 기관손상" aria-label="연도 또는 사고 유형 검색" />
    <select id="yearFilter" aria-label="연도 필터">
      <option value="">전체 연도</option>
    </select>
    <button id="resetBtn" type="button">초기화</button>
  </div>

  <div class="meta">
    <div class="count" id="countText">0 / 0건</div>
    <div class="source">출처: 첨부 data.json · 기준 시점: 파일 수록 기간</div>
  </div>

  <div class="table-box">
    <table aria-label="해양사고 통계 표">
      <thead><tr id="headRow"></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div id="emptyState" class="empty" hidden>조건에 맞는 데이터가 없습니다.</div>
  </div>
</div>

,"좌초":43,"전복":18,"화재/폭발":34,"침몰":22,"행방불명":2,"기관손상":253,"추진기손상":16,"키손상":29,"속구손상":0,"조난":16,"시설물손상":1,"인명사상":21,"안전운항저해":96,"해양오염":2,"기타":0},{"시점":2010,"총계":737,"충돌":174,"접촉":22,"좌초":64,"전복":17,"화재/폭발":25,"침몰":22,"행방불명":0,"기관손상":236,"추진기손상":8,"키손상":24,"속구손상":1,"조난":9,"시설물손상":4,"인명사상":33,"안전운항저해":91,"해양오염":7,"기타":0},{"시점":2011,"총계":946,"충돌":208,"접촉":23,"좌초":64,"전복":38,"화재/폭발":57,"침몰":27,"행방불명":0,"기관손상":261,"추진기손상":13,"키손상":18,"속구손상":1,"조난":41,"시설물손상":4,"인명사상":82,"안전운항저해":101,"해양오염":8,"기타":0},{"시점":2012,"총계":726,"충돌":157,"접촉":21,"좌초":53,"전복":25,"화재/폭발":55,"침몰":26,"행방불명":11,"기관손상":178,"추진기손상":7,"키손상":13,"속구손상":0,"조난":44,"시설물손상":3,"인명사상":57,"안전운항저해":68,"해양오염":8,"기타":0}];
let rows = [];
let headers = [];
const yearFilter = document.getElementById('yearFilter');
const searchInput = document.getElementById('searchInput');
const tableBody = document.getElementById('tableBody');
const headRow = document.getElementById('headRow');
const countText = document.getElementById('countText');
const emptyState = document.getElementById('emptyState');

function getHeaders(data) {
  const set = new Set();
  data.forEach(row => Object.keys(row).forEach(k => set.add(k)));
  return Array.from(set);
}

function buildUI(data) {
  rows = data;
  headers = getHeaders(rows);
  headRow.innerHTML = headers.map(h => `<th>${escapeHtml(h)}</th>`).join('');
  const years = [...new Set(rows.map(r => String(r['시점'] ?? '')))].filter(Boolean).sort((a,b) => Number(a) - Number(b));
  yearFilter.innerHTML = '<option value="">전체 연도</option>' + years.map(y => `<option value="${escapeAttr(y)}">${escapeHtml(y)}년</option>`).join('');
  render();
}

function render() {
  const q = searchInput.value.trim().toLowerCase();
  const selectedYear = yearFilter.value;
  const filtered = rows.filter(row => {
    const year = String(row['시점'] ?? '');
    if (selectedYear && year !== selectedYear) return false;
    if (!q) return true;
    if (year.toLowerCase().includes(q)) return true;
    for (const key of headers) {
      if (key === '시점' || key === '총계') continue;
      if (key.toLowerCase().includes(q)) {
        const value = Number(row[key] ?? 0);
        return value > 0;
      }
    }
    return false;
  });
  countText.textContent = `현재 ${filtered.length}건 / 전체 ${rows.length}건`;
  tableBody.innerHTML = filtered.map(row => '<tr>' + headers.map(h => {
    const value = row[h] ?? '';
    const display = typeof value === 'number' ? value.toLocaleString('ko-KR') : escapeHtml(String(value));
    return `<td data-label="${escapeAttr(h)}">${display}</td>`;
  }).join('') + '</tr>').join('');
  emptyState.hidden = filtered.length !== 0;
}

function escapeHtml(v) {
  return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;");
}
function escapeAttr(v) { return escapeHtml(v); }

searchInput.addEventListener('input', render);
yearFilter.addEventListener('change', render);
document.getElementById('resetBtn').addEventListener('click', () => {
  searchInput.value = '';
  yearFilter.value = '';
  render();
});

fetch('./data.json', { cache: 'no-store' })
  .then(r => {
    if (!r.ok) throw new Error('data.json load failed');
    return r.json();
  })
  .then(buildUI)
  .catch(() => buildUI(FALLBACK_DATA));
</script>
</body>
</html>
